[package]
name = "rpc_gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.102"
axum = "=0.7.9"
bytes = "=1.10.1"
dashmap = "=6.1.0"
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.49.0", features = ["full"] }
toml = "=0.8.23"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter", "fmt"] }
